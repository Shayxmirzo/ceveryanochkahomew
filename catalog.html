<body  class="flex flex-col min-h-screen bg-[[#FBF8EC]]">

      <input required class="border border-[orangered] h-[50px] px-5 w-full rounded-[10px]" type="text" placeholder="Name">
      <input required class="border border-[orangered] h-[50px] px-5 w-full rounded-[10px]" type="text" placeholder="Image URL">
      <input required class="border border-[orangered] h-[50px] px-5 w-full rounded-[10px]" type="number" placeholder="Number">
      <button class="bg-[orangered] h-[50px] text-white rounded-[10px] px-4">Log in</button>
    </form>
  </div>
</div>

    </div>
    

    </div>
